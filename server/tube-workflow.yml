# Workflow for a SEPARATE videos repository (e.g. EugenPrinz/ocui-videos),
# not for ocui itself, so whatever ends up in that repo's release can never
# affect the ocui code repository.
#
# The repo's videos.txt is the playlist; every change to it (edit it right
# in the browser) converts new/changed videos into the "videos" release and
# removes deleted ones. In game:  tube <name>
#
#   # name      fps  source
#   badapple    10   https://www.youtube.com/watch?v=FtutLA63Cp8
#
# Source: a YouTube (or any yt-dlp supported) link, a direct link to a video
# file (.mp4/.webm/...), or "demo". YouTube sometimes refuses GitHub's
# servers ("Sign in to confirm you're not a bot") -- re-run the workflow
# later (Actions -> Run workflow) or use a direct file link.
#
# Setup: put this file at .github/workflows/tube.yml and add videos.txt.
# The converter comes from EugenPrinz/ocui (server/tube_library.py).

name: "tube: sync videos"

on:
  push:
    paths: ["videos.txt", ".github/workflows/tube.yml"]
  workflow_dispatch: # re-run the sync by hand, e.g. after YouTube refused

concurrency:
  group: tube-library
  cancel-in-progress: false

permissions:
  contents: write # create/update the "videos" release

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Get the converter (ocui)
        uses: actions/checkout@v4
        with:
          repository: EugenPrinz/ocui
          path: .ocui

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet --upgrade yt-dlp

      - name: Sync the "videos" release with videos.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python .ocui/server/tube_library.py sync videos.txt
